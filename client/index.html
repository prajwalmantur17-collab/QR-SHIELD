<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          if (!localStorage.getItem('qrshield_saas_light_v1')) {
            localStorage.setItem('qrshield_theme', 'light');
            localStorage.setItem('qrshield_saas_light_v1', '1');
          }
          var theme = localStorage.getItem('qrshield_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            // Default to premium light SaaS theme (#F7F8F6 / #FFFFFF / #167D73)
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (_) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23167D73' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10'/><path d='M9 12h.01'/><path d='M15 12h.01'/><path d='M12 9h.01'/><path d='M12 15h.01'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F8F6" />
    <meta name="description" content="QR Shield — AI-Powered Security, Privacy & Trust platform to verify QR codes, links, and messages before you trust." />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <title>QR Shield — Scan Before You Trust</title>

    <!-- Self-healing script: If old cached HTML loads a nonexistent module chunk, unregister SW & hard reload -->
    <script>
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) || '';
        var isScriptErr = (e && e.target && e.target.tagName === 'SCRIPT');
        if (isScriptErr || msg.indexOf('module script') !== -1 || msg.indexOf('MIME type') !== -1) {
          console.warn('[QR Shield Recovery] Stale script or MIME error detected. Clearing caches...');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) regs[i].unregister();
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var j = 0; j < keys.length; j++) caches.delete(keys[j]);
            });
          }
          if (!sessionStorage.getItem('qrshield_pwa_recovery')) {
            sessionStorage.setItem('qrshield_pwa_recovery', '1');
            window.location.reload();
          }
        }
      }, true);
    </script>
  </head>
  <body class="bg-canvas dark:bg-dark-bg text-content-primary dark:text-dark-primary font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          // In local development, avoid stale SW caching or Vite HMR collisions
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) regs[i].unregister();
          });
        } else {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js')
              .then(function(reg) {
                if (reg) reg.update();
              })
              .catch(function(err) { console.log('SW registration error:', err); });
          });
        }
      }
    </script>
  </body>
</html>
